# Standalone terminal-detect native-image support.
# --enable-native-access is required for the FFM probe transports
# (FfmPosix, Win32Probe); without it they report unavailable and probing
# falls back to stty. No shared arenas are used here (confined only), so
# -H:+SharedArenaSupport is not needed; all downcall handles live behind
# lazy holders initialized at run time by default.
#
# The downcall holder classes must stay runtime-initialized: build-time
# initialization (e.g. Quarkus broad --initialize-at-build-time patterns)
# freezes their MethodHandles into constants, and GraalVM CE 25.0.1 cannot
# build the linkToNative graph for constant downcall receivers
# (ParsingError on FfmPosix.read/tcsetattr, issue #368). Narrow
# exact-class runtime patterns win over broad build-time ones, so this
# survives embedder init configuration. Same pattern as terminal-tty.
Args = --initialize-at-run-time=org.aesh.terminal.detect.FfmPosix$Handles,\
       org.aesh.terminal.detect.Win32Probe$Handles \
       --enable-native-access=ALL-UNNAMED
