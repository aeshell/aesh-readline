# Standalone terminal-detect native-image support.
# --enable-native-access is required for the FFM probe transports
# (FfmPosix, Win32Probe); without it they report unavailable and probing
# falls back to stty. No shared arenas are used here (confined only), so
# -H:+SharedArenaSupport is not needed; all downcall handles live behind
# lazy holders initialized at run time by default.
Args = --enable-native-access=ALL-UNNAMED
