name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '25']
    name: build (JDK ${{ matrix.java-version }})

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: script -qefc 'mvn clean compile test' /dev/null

  native-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven
        native-image-job-reports: true
    - name: Build and native test terminal-tty and terminal-detect
      run: mvn clean verify -pl terminal-tty,terminal-detect -am -Dformat.skip=true

  native-test-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven
        native-image-job-reports: true
    - name: Build and native test terminal-tty and terminal-detect
      shell: bash
      # GraalVM is pinned to 25 above, so keep the FFM overlay: deleting it
      # would force the JNI fallback and neuter the FFM downcall
      # registration tests. POSIX FFM tests stay platform-gated off.
      run: mvn clean verify -pl terminal-tty,terminal-detect -am -Dformat.skip=true -Dnative.delete.ffm=false

  # Guard against artifact regressions (#209, #211, #218):
  # Build with JDK 25 (activates java22-ffm profile, produces MRJAR).
  # ArtifactVerificationTest checks: bytecode versions, native-image.properties,
  # ServiceLoader file, cross-platform class loading safety.
  artifact-verify:
    runs-on: ubuntu-latest
    name: artifact-verify (build JDK 25, verify artifact)

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build and verify artifact
      run: script -qefc 'mvn clean verify -pl terminal-tty -am -Dformat.skip=true' /dev/null
    # Guard against MRJAR API drift (#342): jar exits 1 on any finding,
    # so silence is the assertion. An in-repo unit test cannot do this —
    # one JVM sees only one variant of each versioned class.
    - name: Validate multi-release JARs
      run: |
        tty_jar=$(ls terminal-tty/target/terminal-tty-*.jar | grep -v -e javadoc -e sources -e tests | head -1)
        detect_jar=$(ls terminal-detect/target/terminal-detect-*.jar | grep -v -e javadoc -e sources | head -1)
        jar --validate --file "$tty_jar"
        jar --validate --file "$detect_jar"

  # Guard against native-image regressions (#209, #218):
  # Build the released JAR with JDK 25, then build a native-image from it
  # using a named-package main class (not default package — #209 was
  # package-dependent). Verifies ServiceLoader, class init, and provider
  # discovery work correctly in the native binary.
  native-jar-verify:
    runs-on: ubuntu-latest
    name: native-jar-verify (native-image from JAR)

    steps:
    - uses: actions/checkout@v7
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven
    - name: Build JARs
      run: mvn clean install -DskipTests -Dformat.skip=true
    - name: Build native-image from released JARs
      run: |
        # Compile the verify app against the released JARs
        CP=$(find . -path '*/target/*.jar' -not -name '*-sources*' -not -name '*-javadoc*' -not -name '*-tests*' \
             -not -path '*/benchmark/*' -not -path '*/examples/*' -not -path '*/bom/*' \
             | tr '\n' ':')
        mkdir -p /tmp/verify-classes
        javac -cp "$CP" -d /tmp/verify-classes \
          terminal-tty/src/test/java/org/aesh/terminal/tty/nativeimage/NativeImageVerify.java
        # Build native-image using the packaged JARs (not target/classes)
        # This tests what external consumers like Quarkus actually see
        native-image --no-fallback -cp "/tmp/verify-classes:$CP" \
          org.aesh.terminal.tty.nativeimage.NativeImageVerify \
          /tmp/native-verify
    - name: Run native verification
      run: /tmp/native-verify

  windows-test:
    runs-on: windows-latest
    strategy:
      matrix:
        java-version: ['17', '25']
        # Validate charset-default paths (Phase 3a, #280): the runners'
        # default JVM charset is windows-1252, the UTF-8 leg pins the
        # Cygwin/UTF-8 agreement explicitly.
        file-encoding: ['UTF-8', 'windows-1252']
    name: windows-test (JDK ${{ matrix.java-version }}, ${{ matrix.file-encoding }})

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Install dependencies
      shell: bash
      run: mvn clean install -pl terminal-api -am -DskipTests -Dformat.skip=true
    - name: Build and test terminal-tty
      shell: bash
      env:
        JAVA_TOOL_OPTIONS: -Dfile.encoding=${{ matrix.file-encoding }}
      run: mvn clean test -pl terminal-tty -Dformat.skip=true

  # Provider selection per Windows environment (#289): isSupported() is a
  # pure env heuristic, so each leg controls the env and the
  # self-activating TerminalProviderEnvTest assertions run for real.
  # Legs: msys (Git Bash default), dumb-term (TERM=dumb decline),
  # native (Cygwin indicators removed).
  windows-env-matrix:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - name: msys
            setup: export MSYSTEM=MINGW64
          - name: dumb-term
            setup: export MSYSTEM=MINGW64; export TERM=dumb
          - name: native
            setup: unset MSYSTEM; unset PWD
    name: windows-env (${{ matrix.name }})

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Install dependencies
      shell: bash
      run: mvn clean install -pl terminal-api -am -DskipTests -Dformat.skip=true
    - name: Run provider selection tests
      shell: bash
      run: |
        ${{ matrix.setup }}
        mvn clean test -pl terminal-tty -Dformat.skip=true \
          -Dtest='TerminalProviderEnvTest,TerminalProviderTest,TerminalProviderPriorityTest' \
          -Dsurefire.failIfNoSpecifiedTests=false

  # Mimic the Quarkus forked dev-mode console setup on headless Windows (#375):
  # bash steps inherit a POSIX-style PWD, which trips the Cygwin/MSYS fallback
  # in detectCygwinOrMsys, admitting the provider chain with no console
  # attached — the exact environment of quarkusio/quarkus#57716, where forked
  # dev-mode JVMs intermittently go silent before the boot banner. Runs a
  # standalone main (not surefire) for faithful stdin control; every build is
  # watchdog-guarded and dumps all stacks on timeout.
  windows-quarkus-mimic:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msys-inherit
            setup: export MSYSTEM=MINGW64
            launch: direct
          - name: msys-pipe
            setup: export MSYSTEM=MINGW64
            launch: piped
          - name: plain-inherit
            setup: unset MSYSTEM
            launch: direct
          - name: plain-pipe
            setup: unset MSYSTEM
            launch: piped
    name: windows-quarkus-mimic (${{ matrix.name }})
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
    # JDK 21 matches the failing Quarkus leg (Maven Tests - JDK 21 Windows).
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install dependencies
      shell: bash
      run: mvn clean install -pl terminal-tty -am -DskipTests -Dformat.skip=true
    - name: Build test classpath
      shell: bash
      run: mvn -q -pl terminal-tty dependency:build-classpath -Dmdep.outputFile=target/qm-cp.txt -Dmdep.includeScope=test -Dformat.skip=true
    - name: Run Quarkus fork mimic
      shell: bash
      run: |
        ${{ matrix.setup }}
        CP="terminal-tty/target/test-classes;terminal-tty/target/classes;$(cat terminal-tty/target/qm-cp.txt)"
        if [ "${{ matrix.launch }}" = "piped" ]; then
          # Never-EOF stdin: models a fork whose stdin stays open but silent.
          # Single coproc for the whole step: re-creating it per pass leaves
          # the name bound to the previous pass's open fds, so pass 2+ dies
          # with "ambiguous redirect". Created once here, shared by all passes.
          coproc QMPIPE { tail -f /dev/null; }
        fi
        for i in 1 2 3 4 5; do
          echo "=== mimic pass $i/5 (${{ matrix.name }}) ==="
          if [ "${{ matrix.launch }}" = "piped" ]; then
            java -cp "$CP" org.aesh.terminal.tty.mimic.QuarkusForkMimic both 20 8 60 <&${QMPIPE[0]} || exit 1
          else
            java -cp "$CP" org.aesh.terminal.tty.mimic.QuarkusForkMimic both 20 8 60 || exit 1
          fi
        done
        if [ "${{ matrix.launch }}" = "piped" ]; then
          kill $QMPIPE_PID 2>/dev/null || true
        fi
