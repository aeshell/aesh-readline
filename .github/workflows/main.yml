name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '25']
    name: build (JDK ${{ matrix.java-version }})

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: script -qefc 'mvn clean compile test' /dev/null

  native-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven
        native-image-job-reports: true
    - name: Build and native test terminal-tty
      run: mvn clean verify -pl terminal-tty -am -Dformat.skip=true

  native-test-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven
        native-image-job-reports: true
    - name: Build and native test terminal-tty
      shell: bash
      run: mvn clean verify -pl terminal-tty -am -Dformat.skip=true

  windows-test:
    runs-on: windows-latest
    strategy:
      matrix:
        java-version: ['17', '25']
    name: windows-test (JDK ${{ matrix.java-version }})

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Install dependencies
      shell: bash
      run: mvn clean install -pl terminal-api -am -DskipTests -Dformat.skip=true
    - name: Build and test terminal-tty
      shell: bash
      run: mvn clean test -pl terminal-tty -Dformat.skip=true
