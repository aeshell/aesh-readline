name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean compile test

  windows-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Compile native DLL
      shell: cmd
      run: >
        "C:\msys64\mingw64\bin\gcc.exe" -shared -O2
        -I"%JAVA_HOME%\include" -I"%JAVA_HOME%\include\win32"
        -o terminal-tty\src\main\resources\native\windows-x86_64\aesh-console.dll
        terminal-tty\src\main\native\WinConsoleNative.c -lkernel32
    - name: Build and test
      run: mvn clean compile test -Dno-format
